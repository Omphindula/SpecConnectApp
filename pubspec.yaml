name: mediconnect
description: "MediConnect - University of Mpumalanga Healthcare Platform"
publish_to: 'none'
version: 1.0.0


environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  url_launcher: ^6.1.14
  crypto: ^3.0.0
  json_annotation: ^4.0.0
  intl: 0.20.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  fl_chart: 0.68.0
  google_fonts: 6.1.0
  shared_preferences: 2.3.2
  path_provider: 2.1.4
  provider: 6.1.2
  http: '>=1.0.0'
  uuid: '>=3.0.0'
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/.env
